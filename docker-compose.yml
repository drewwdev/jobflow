services:
  db:
    image: postgres:16
    container_name: jobflow-db
    environment:
      POSTGRES_USER: jobflow
      POSTGRES_PASSWORD: secretpw
      POSTGRES_DB: jobflow
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow -d jobflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./JobFlow.Api
      dockerfile: Dockerfile
    container_name: jobflow-api
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=jobflow;Username=jobflow;Password=secretpw;SSL Mode=Disable;Include Error Detail=true
      Cors__AllowedOrigins__0: http://localhost:5173
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
